<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidatura | Contrata Sul</title><link rel="stylesheet" href="admin.css"></head><body><header><div class="brand">CONTRATA <b>SUL</b><small>OPORTUNIDADES</small></div><a href="index.html#vagas">← Ver vagas</a></header><main class="application-main"><div class="panel"><span class="eyebrow">PROCESSO SELETIVO</span><h1>Envie sua candidatura</h1><p id="job-label">Carregando vaga...</p><form id="application-form" hidden><label>Nome completo<input id="app-name" required maxlength="100" autocomplete="name"></label><label>E-mail<input id="app-email" required type="email" maxlength="150" autocomplete="email"></label><label>Telefone<input id="app-phone" required type="tel" maxlength="25" autocomplete="tel"></label><label>Apresentação profissional (opcional)<textarea id="app-message" maxlength="1500" rows="5" placeholder="Conte brevemente sua experiência e interesse"></textarea></label><label class="check"><input type="checkbox" id="app-consent" required> Concordo que meus dados sejam utilizados para este processo seletivo e entendo que posso solicitar sua exclusão à equipe.</label><p class="fine">Não envie documentos pessoais sensíveis neste formulário. O cadastro não exige conta.</p><button id="app-submit">Enviar candidatura</button></form><p id="app-status" role="status" aria-live="polite"></p></div></main><script type="module" src="candidatar.js"></script></body></html>
