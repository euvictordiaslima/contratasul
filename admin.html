<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Contrata Sul</title><link rel="stylesheet" href="admin.css"></head><body><header><div class="brand">CONTRATA <b>SUL</b> <small>PAINEL ADMINISTRATIVO</small></div><a href="index.html">← Voltar ao site</a></header><main><section id="login-panel" class="panel"><h1>Entrar no painel</h1><p>Somente usuários autorizados podem gerenciar vagas.</p><form id="login-form"><label>Usuário<input id="username" type="text" autocomplete="username" minlength="3" maxlength="32" placeholder="Seu usuário" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><section id="admin-panel" hidden><div class="heading"><div><small>GERENCIAMENTO</small><h1>Vagas e oportunidades</h1><p>Publique, edite ou encerre oportunidades no site público.</p></div><button id="logout" class="secondary">Sair</button></div><div class="columns"><div class="panel"><h2 id="form-heading">Cadastrar vaga</h2><form id="vacancy-form"><input id="vacancy-id" type="hidden"><label>Cargo<input id="title" maxlength="100" required></label><label>Empresa<input id="company" maxlength="100" required></label><label>Cidade<input id="location" maxlength="100" required></label><div class="two"><label>Modalidade<select id="mode"><option>Presencial</option><option>Híbrido</option><option>Remoto</option></select></label><label>Contrato<select id="contract"><option>CLT</option><option>PJ</option><option>Estágio</option><option>Temporário</option><option>Outro</option></select></label></div><label>Salário (opcional)<input id="salary" maxlength="70"></label><label>Descrição e requisitos<textarea id="description" rows="6" maxlength="2500" required></textarea></label><label class="check"><input id="published" type="checkbox" checked> Publicar no site</label><div class="actions"><button id="save-button">Salvar vaga</button><button class="secondary" type="button" id="clear">Limpar</button></div></form></div><div class="panel"><h2>Vagas cadastradas <span id="count"></span></h2><div id="vacancies" aria-live="polite"></div></div></div></section><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="admin.js"></script></body></html>
